name: Release Tag

# Crea un tag anotado vX.Y.Z en cada push a main (= merge de PR).
# Lee la versión de package.json. Idempotente: si el tag ya existe, lo salta.
# Después de crear el tag, construye y publica la imagen Docker.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Create v* tag from package.json
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version from package.json
        id: version
        run: |
          VERSION=$(node -e "const p = require('./package.json'); console.log(p.version);")
          if [ -z "$VERSION" ]; then
            echo "❌ No se pudo extraer la versión de package.json"
            exit 1
          fi
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "📦 Versión detectada: ${VERSION} → tag candidato: ${TAG}"

      - name: Check if tag already exists
        id: check_tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "⏭️  Tag ${TAG} ya existe, saltando creación."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "🆕 Tag ${TAG} no existe, se creará."
          fi

      - name: Create annotated tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git tag -a "$TAG" -m "Release ${TAG}"
          git push origin "$TAG"
          echo "✅ Tag ${TAG} creado y pushado."

      - name: Set up Docker Buildx
        if: steps.check_tag.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.check_tag.outputs.exists == 'false'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          IMAGE="ai-civilization-sandbox:${VERSION}"
          docker build -t "$IMAGE" .
          docker tag "$IMAGE" "${{ secrets.DOCKER_USERNAME }}/ai-civilization-sandbox:${VERSION}"
          docker push "${{ secrets.DOCKER_USERNAME }}/ai-civilization-sandbox:${VERSION}"
          echo "✅ Imagen Docker ${IMAGE} construida y publicada."
