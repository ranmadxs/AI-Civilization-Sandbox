name: PR Checks

on:
  pull_request:
    branches: [product]

permissions:
  contents: read
  pull-requests: write

jobs:
  semver-check:
    name: Semver Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check package.json was bumped
        run: |
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            echo "Comparando package.json entre ${BASE_SHA:0:7} (base) y ${HEAD_SHA:0:7} (head)"
            if git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" | grep -q '^package\.json$'; then
              echo "✅ package.json modificado en el PR"
              git diff "${BASE_SHA}" "${HEAD_SHA}" -- package.json
            else
              echo "❌ package.json NO fue modificado en este PR"
              echo ""
              echo "Política del proyecto: TODO PR debe bumbear la versión en"
              echo "package.json siguiendo semver:"
              echo "  - fix      → patch  (X.Y.Z+1)"
              echo "  - feat     → minor  (X.Y+1.0)"
              echo "  - BREAKING → major  (X+1.0.0)"
              echo ""
              echo "Editá package.json y bumbeá version."
              exit 1
            fi

  build-check:
    name: Build & TypeScript Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    permissions:
      contents: read

    steps:
      - name: Check if any job failed
        if: always()
        run: |
          RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs")
          FAILED=$(echo "$RESPONSE" | python3 -c "import sys,json;[print(j['name']) for j in json.load(sys.stdin)['jobs'] if j['name']!='${{ github.job }}' and j['conclusion'] in ('failure','cancelled','skipped')][:1]")
          if [ -n "$FAILED" ]; then
            echo "❌ Job $FAILED failed, skipping"
            exit 1
          fi
        shell: bash

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install pnpm
        run: |
          npm install -g pnpm@9.15.0
          echo "$(npm config get prefix)/bin" >> $GITHUB_PATH
          pnpm --version

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: TypeScript check
        run: |
          pnpm build

  simulation-check:
    name: Simulation Smoke Test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    permissions:
      contents: read

    steps:
      - name: Check if any job failed
        if: always()
        run: |
          RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs")
          FAILED=$(echo "$RESPONSE" | python3 -c "import sys,json;[print(j['name']) for j in json.load(sys.stdin)['jobs'] if j['name']!='${{ github.job }}' and j['conclusion'] in ('failure','cancelled','skipped')][:1]")
          if [ -n "$FAILED" ]; then
            echo "❌ Job $FAILED failed, skipping"
            exit 1
          fi
        shell: bash

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install pnpm
        run: |
          npm install -g pnpm@9.15.0
          echo "$(npm config get prefix)/bin" >> $GITHUB_PATH
          pnpm --version

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Run smoke simulation
        run: |
          pnpm smoke:simulation

  docker-build-test:
    name: Docker Build Test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    permissions:
      contents: read

    steps:
      - name: Check if any job failed
        if: always()
        run: |
          RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs")
          FAILED=$(echo "$RESPONSE" | python3 -c "import sys,json;[print(j['name']) for j in json.load(sys.stdin)['jobs'] if j['name']!='${{ github.job }}' and j['conclusion'] in ('failure','cancelled','skipped')][:1]")
          if [ -n "$FAILED" ]; then
            echo "❌ Job $FAILED failed, skipping"
            exit 1
          fi
        shell: bash

      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          VERSION=$(grep -E '"version"' package.json | head -1 | sed -E 's/.*"version":\s*"([^"]+)".*/\1/')
          IMAGE="ai-civilization-sandbox-test:${VERSION}"
          docker build -t "$IMAGE" .
          echo "✅ Docker image built successfully: $IMAGE"